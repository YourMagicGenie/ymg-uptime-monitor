name: Host check

# Hourly uptime and certificate-expiry check for the public YMG hosts.
# A failing scheduled run emails the person who last changed the cron line
# below (GitHub's "Actions: failed workflows" notification). See RUNBOOK.md.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      min_days:
        description: "Fail when a certificate expires in fewer than this many days (use 400 to test the alert)"
        type: number
        default: 14

permissions:
  contents: read

concurrency:
  group: host-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check hosts
        env:
          MIN_DAYS: ${{ inputs.min_days || 14 }}
        run: python3 check_hosts.py --min-days "$MIN_DAYS"
